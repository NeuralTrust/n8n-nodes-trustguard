# CI pipeline for PRs targeting develop or main
# Lint & tests (Node) via the shared runner, SAST gates, and a local build check.

name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read
  security-events: write
  actions: read
  id-token: write

jobs:
  tests:
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@main
    with:
      language: node
      # Node 24 bundles npm 11. The lockfile is generated by npm 11, and npm 10
      # (bundled with Node 22) resolves this tree incompatibly, so the runtime
      # choice is what keeps `npm ci` working.
      language_version: '24'
      # tests.yml defaults to `npx eslint .`. Use the project's own command so
      # CI runs `n8n-node lint`, the same wrapper contributors run locally and
      # the one that reports n8n Cloud eligibility.
      lint_command: npm run lint

  security:
    uses: NeuralTrust/workflows/.github/workflows/sast.yml@main
    with:
      njsscan_enabled: true
      gitleaks_enabled: true

  build:
    # tests.yml has no build step, and a community node must compile before it
    # can be published, so this one stays local.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
